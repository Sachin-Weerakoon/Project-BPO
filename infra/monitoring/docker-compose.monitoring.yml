# Placeholder: optional Prometheus for LOCAL testing only. Not started by default.
# On staging (k3s) Prometheus runs inside the cluster instead (see prometheus.yml).
# For local use, switch prometheus.yml to the static_configs job.
# Use with the main compose file:
#   docker compose -f docker-compose.yml -f infra/monitoring/docker-compose.monitoring.yml --profile monitoring up -d
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"     # localhost only (use an SSH tunnel on the VM)
    restart: unless-stopped
    mem_limit: 300m

volumes:
  prometheus-data:
