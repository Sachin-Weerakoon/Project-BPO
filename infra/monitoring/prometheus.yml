# Placeholder: Prometheus scrape config for staging (docs/monitoring.md section 5).
# Not used yet. Turn on after MVP with: docker compose --profile monitoring up -d
global:
  scrape_interval: 30s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics          # needs METRICS_ENABLED=true on the api
    static_configs:
      - targets: ['api:5000']       # internal Docker network only, never public
