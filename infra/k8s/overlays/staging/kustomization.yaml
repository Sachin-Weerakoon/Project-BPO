# Staging overlay: k3s on Oracle Cloud (ADR 0002, runbook docs/runbooks/k3s-oracle-setup.md).
# Usage: kubectl apply -k infra/k8s/overlays/staging
# CI sets the image tags to the git SHA before applying, e.g.:
#   kustomize edit set image ghcr.io/sachin-weerakoon/project-bpo-api=ghcr.io/sachin-weerakoon/project-bpo-api:<git-sha>
# api-secrets is created by the deploy pipeline from GitHub Actions secrets (not in Git).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/sachin-weerakoon/project-bpo-api
    newTag: latest   # replaced by CI with the git SHA
  - name: ghcr.io/sachin-weerakoon/project-bpo-web
    newTag: latest   # replaced by CI with the git SHA