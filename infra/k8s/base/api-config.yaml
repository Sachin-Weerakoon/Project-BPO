apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: remotebpo
data:
  NODE_ENV: "production"
  API_PORT: "5000"
  LOG_LEVEL: "info"
  REDIS_URL: "redis://redis:6379"                  # in-cluster Redis Service
  CORS_ORIGIN: "https://staging.example.com"       # placeholder until we have a domain
  METRICS_ENABLED: "false"