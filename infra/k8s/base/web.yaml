apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: remotebpo
  labels: { app: web }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: web
          image: ghcr.io/sachin-weerakoon/project-bpo-web:latest   # placeholder until CI pushes images
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"   # Next.js standalone server must listen on all interfaces inside the pod
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          # Next.js has no health endpoint yet, so check that the port accepts connections.
          # TODO: switch to httpGet on a /api/health route once the frontend adds one.
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: remotebpo
spec:
  selector: { app: web }
  ports:
    - port: 3000
      targetPort: 3000