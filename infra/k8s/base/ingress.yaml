apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remotebpo
  namespace: remotebpo
spec:
  ingressClassName: traefik   # k3s ships with Traefik
  rules:
    - host: staging.example.com   # placeholder until we have a domain
      http:
        paths:
          # Exact /health goes to the API, so uptime checks test the API (docs/environment-parity.md 3).
          # /ready and /metrics stay internal (not routed).
          - path: /health
            pathType: Exact
            backend:
              service: { name: api, port: { number: 5000 } }
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 5000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 3000 } }
  # TLS (Let's Encrypt via cert-manager) to be added once the domain is known.