# Centralized logs for staging. Apply after the base: kubectl apply -k infra/k8s/logging
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: remotebpo
resources:
  - rbac.yaml
  - alloy.yaml
configMapGenerator:
  - name: alloy-config
    files:
      - config.alloy
generatorOptions:
  labels: { app: alloy }
